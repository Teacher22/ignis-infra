name: Postgres — Create user and database

on:
  workflow_dispatch:
    inputs:
      db_name:
        description: 'Database name to create'
        required: true
        type: string
      db_user:
        description: 'Username to create'
        required: true
        type: string
      db_password:
        description: 'Password for the user'
        required: true
        type: string

jobs:
  create-user:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Create user and database on postgres
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_NAME: ${{ inputs.db_name }}
          DB_USER: ${{ inputs.db_user }}
          DB_PASSWORD: ${{ inputs.db_password }}
          POSTGRES_ADMIN_USER: ${{ secrets.POSTGRES_ADMIN_USER }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.POSTGRES_VM_HOST }}
          username: ${{ secrets.POSTGRES_VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: DB_NAME,DB_USER,DB_PASSWORD,POSTGRES_ADMIN_USER,POSTGRES_ADMIN_PASSWORD
          script: |
            # Always connect to template1 — it exists in every postgres instance
            PSQL="docker exec -e PGPASSWORD=$POSTGRES_ADMIN_PASSWORD ignis-postgres psql -U $POSTGRES_ADMIN_USER -d template1"

            echo "--- Testing connection..."
            $PSQL -c "SELECT 1;" || { echo "ERROR: Cannot connect to postgres. Check POSTGRES_ADMIN_USER and POSTGRES_ADMIN_PASSWORD secrets."; exit 1; }

            echo "--- Creating user '$DB_USER'..."
            $PSQL -c "CREATE USER \"$DB_USER\" WITH PASSWORD '$DB_PASSWORD';" 2>/dev/null \
              || $PSQL -c "ALTER USER \"$DB_USER\" WITH PASSWORD '$DB_PASSWORD';"

            echo "--- Creating database '$DB_NAME'..."
            DB_EXISTS=$($PSQL -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'")
            if [ "$DB_EXISTS" = "1" ]; then
              echo "Database '$DB_NAME' already exists, skipping create..."
            else
              $PSQL -c "CREATE DATABASE \"$DB_NAME\" OWNER \"$DB_USER\";"
              echo "Database '$DB_NAME' created."
            fi

            echo "--- Granting privileges..."
            PSQL_DB="docker exec -e PGPASSWORD=$POSTGRES_ADMIN_PASSWORD ignis-postgres psql -U $POSTGRES_ADMIN_USER -d $DB_NAME"
            $PSQL -c "GRANT ALL PRIVILEGES ON DATABASE \"$DB_NAME\" TO \"$DB_USER\";"
            $PSQL_DB -c "GRANT ALL ON SCHEMA public TO \"$DB_USER\";"
            $PSQL_DB -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"$DB_USER\";"
            $PSQL_DB -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO \"$DB_USER\";"
            $PSQL_DB -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO \"$DB_USER\";"

            echo "Done — '$DB_USER' has full admin access to '$DB_NAME'"
