services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/teacher22/ignisfit-backend:latest}
    container_name: ignisfit-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/credentials/gcs-key.json:ro
    environment:
      DB_URL: jdbc:postgresql://ignis-postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_SECRET: ${SUPER_ADMIN_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/gcs-key.json
    networks:
      - ignis-net
    ports:
      - "8080:8080"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/teacher22/ignisfit-frontend:latest}
    container_name: ignisfit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

networks:
  ignis-net:
    external: true
    name: ignis-net
