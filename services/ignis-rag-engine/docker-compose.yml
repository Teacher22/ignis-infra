services:
  postgres:
    image: postgres:16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ignis}
      POSTGRES_USER: ${DB_USER:-ignis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ignis}
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ignis} -d ${DB_NAME:-ignis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: rag-qdrant
    restart: unless-stopped
    volumes:
      - rag_qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    volumes:
      - rag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/teacher22/ignis-rag-api:latest}
    container_name: rag-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-ignis}:${DB_PASSWORD:-ignis}@postgres:5432/${DB_NAME:-ignis}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "3001:3001"

  worker:
    image: ${API_IMAGE:-ghcr.io/teacher22/ignis-rag-api:latest}
    container_name: rag-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-ignis}:${DB_PASSWORD:-ignis}@postgres:5432/${DB_NAME:-ignis}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NODE_ENV: production
    command: node dist/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/teacher22/ignis-rag-web:latest}
    container_name: rag-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  rag_postgres_data:
  rag_qdrant_data:
  rag_redis_data:
