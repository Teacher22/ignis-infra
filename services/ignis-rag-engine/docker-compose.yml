services:
  api:
    image: ${API_IMAGE:-ghcr.io/teacher22/ignis-rag-api:latest}
    container_name: rag-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:6379
      QDRANT_URL: http://${QDRANT_HOST}:6333
      NODE_ENV: production
    ports:
      - "3001:3001"

  worker:
    image: ${API_IMAGE:-ghcr.io/teacher22/ignis-rag-api:latest}
    container_name: rag-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:6379
      QDRANT_URL: http://${QDRANT_HOST}:6333
      NODE_ENV: production
    command: node dist/worker.js

  web:
    image: ${WEB_IMAGE:-ghcr.io/teacher22/ignis-rag-web:latest}
    container_name: rag-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
